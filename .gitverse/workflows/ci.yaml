name: ci
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build -o /tmp/gv ./cmd/gv && /tmp/gv version

  # Publishes a tiny static site as an artifact. GitVerse Pages deploys the
  # contents of an artifact, so this is what a package repository would later
  # be built into.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build site
        run: |
          mkdir -p site
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>gv</title><h1>gv</h1><p>GitVerse from the command line.</p>' > site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
